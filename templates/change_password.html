<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | LOST & FOUND</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .password-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .password-card {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            box-shadow: 0 18px 45px rgba(31, 41, 91, 0.12);
        }

        .password-card h1 {
            margin-bottom: 8px;
            color: #20205a;
        }

        .password-card .subtitle {
            margin-bottom: 28px;
            color: #77758f;
        }

        .password-field {
            margin-bottom: 18px;
        }

        .password-field label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #34345f;
        }

        .password-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            border: 1px solid #ddddec;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .password-field input:focus {
            border-color: #00a6a6;
            box-shadow: 0 0 0 3px rgba(0,166,166,0.10);
        }

        .password-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .password-actions button,
        .password-actions a {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .password-actions button {
            border: none;
            background: #00a6a6;
            color: white;
        }

        .password-actions button:hover {
            background: #008f8f;
        }

        .password-actions a {
            border: 1px solid #ddddec;
            color: #555477;
            background: white;
        }

        .password-actions a:hover {
            background: #f7f7fb;
        }
    </style>
</head>

<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-container">
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">
                        <span class="flash-icon">
                            {% if category == "error" %}
                                ⚠
                            {% else %}
                                ✓
                            {% endif %}
                        </span>

                        <span>{{ message }}</span>

                        <button type="button" onclick="this.parentElement.remove()">
                            ×
                        </button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

<div class="password-page">

    <div class="password-card">

        <h1>Change Password</h1>

        <p class="subtitle">
            Update your account password securely.
        </p>

        <form method="POST">

            <div class="password-field">
                <label for="current_password">
                    Current Password
                </label>

                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    required
                >
            </div>

            <div class="password-field">
                <label for="new_password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    minlength="8"
                    required
                >
            </div>

            <div class="password-field">
                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="8"
                    required
                >
            </div>

            <div class="password-actions">

                <a href="{{ url_for('dashboard') }}">
                    Cancel
                </a>

                <button type="submit">
                    Change Password
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
